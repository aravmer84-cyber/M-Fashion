
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M Fashion | Portfolio</title>
    <style>
        body {
            background-color: #111111;
            color: #E5A93B; /* Gold tone */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 50px 20px;
            background: linear-gradient(180deg, #1f1f1f, #111111);
        }
        h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            color: #FFFFFF;
        }
        p.subtitle {
            color: #A5A5A5;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .gallery-item {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 4px;
            color: #fff;
        }
        .btn {
            display: inline-block;
            background-color: #E5A93B;
            color: #111111;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            margin-top: 40px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #FFFFFF;
        }
    </style>
</head>
<body>

    <header>
        <h1>M FASHION</h1>
        <p class="subtitle">Bespoke Luxury & Contemporary Design</p>
    </header>

    <div class="container">
        <h2>Our Collection</h2>
        <p style="color: #A5A5A5;">Welcome to our portfolio. We build elegant designs crafted to stand out.</p>
        
        <div class="gallery">
            <div class="gallery-item">
                <h3>Evening Wear</h3>
                <p style="color: #A5A5A5;">Custom tailored lookbooks.</p>
            </div>
            <div class="gallery-item">
                <h3>Contemporary</h3>
                <p style="color: #A5A5A5;">Modern elegant silhouettes.</p>
            </div>
        </div>

        <!-- Replace the '#' below with your actual Facebook Page Link -->
        <a href="#" class="btn" target="_blank">Contact Us on Facebook</a>
    </div>

</body>
</html>
